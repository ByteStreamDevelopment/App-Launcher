name: Release

# Forgejo-Variante von .github/workflows/release.yml – für einen Spiegel des Repos auf Forgejo.
# Baut bei jedem veröffentlichten Release (Tag z. B. v2.1.0) eine signierte APK und hängt sie an das Release.
# Pre-Releases (v2.2.0-beta1) werden zur Beta.
#
# Liegt das Repo auf git.nebendahl.eu und ist FORGEJO_AUTO_IMPORT=1, übernimmt der Store die APK am Release
# automatisch – dann BYTEDROIDE_API_KEY einfach NICHT setzen (sonst gäbe es die App zweimal).
#
# Secrets (Repo → Einstellungen → Actions → Secrets):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD   Signaturschlüssel (wie bei GitHub)
#   RELEASE_TOKEN       optional: Forgejo-Token mit write:repository, falls der automatische Token
#                       keine Release-Anhänge hochladen darf
#   BYTEDROIDE_API_KEY  optional: Upload in den Store per API (nur ohne Auto-Import)
# Variable: BYTEDROIDE_APP  z. B. ProfImpossible/bytedroide

on:
  release:
    types: [published]

jobs:
  apk:
    # Label deines Runners (siehe Forgejo → Website-Administration → Actions → Runner), meist "docker"
    runs-on: docker
    container:
      image: node:20-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - uses: https://github.com/actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: https://github.com/android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Version aus dem Tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: scripts/version-from-tag.sh "$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Signaturschlüssel einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 fehlt – ohne festen Schlüssel funktionieren Updates nicht."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Tests & APK bauen
        run: >
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: APK umbenennen
        id: apk
        run: |
          FILE="ByteDroide-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: An das Forgejo-Release hängen
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: token $TOKEN" \
            -F "attachment=@$FILE;type=application/vnd.android.package-archive" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${{ github.event.release.id }}/assets?name=$FILE"
          echo

      - name: Im ByteDroide-Store veröffentlichen
        env:
          API_KEY: ${{ secrets.BYTEDROIDE_API_KEY }}
          APP: ${{ vars.BYTEDROIDE_APP }}
          NOTES: ${{ github.event.release.body }}
          CHANNEL: ${{ github.event.release.prerelease && 'beta' || 'stable' }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$APP" ]; then
            echo "Kein BYTEDROIDE_API_KEY/BYTEDROIDE_APP – Store übernimmt die APK über den Forgejo-Import (falls aktiv)."
            exit 0
          fi
          ENC_NOTES=$(node -e 'process.stdout.write(encodeURIComponent((process.env.NOTES || "").slice(0, 3500)))')
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "X-Release-Notes: $ENC_NOTES" \
            --data-binary @"$FILE" \
            "https://apps.nebendahl.eu/api/dev/apps/$APP/releases?channel=$CHANNEL&version=${{ steps.version.outputs.name }}"
          echo
