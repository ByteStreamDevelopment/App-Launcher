name: Release

# Baut bei jedem veröffentlichten GitHub-Release (Tag z. B. v2.1.0) eine signierte APK,
# hängt sie an das Release und veröffentlicht sie im ByteDroide-Store.
# Pre-Releases (z. B. v2.2.0-beta1) landen im Beta-Kanal.
#
# Benötigte Secrets (Repo → Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64     base64 der release.jks          (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD   Passwort des Keystores
#   KEY_ALIAS           Alias des Schlüssels (z. B. store)
#   KEY_PASSWORD        Passwort des Schlüssels
#   BYTEDROIDE_API_KEY  API-Schlüssel aus dem Entwickler-Portal (optional – ohne wird nicht hochgeladen)
# Variable (… → Variables):
#   BYTEDROIDE_APP      App im Store, z. B. ProfImpossible/bytedroide

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version aus dem Tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          NAME="${TAG#v}"; NAME="${NAME#V}"
          # versionCode aus den Zahlen: 2.1.3 -> 2010300
          IFS='.-' read -r MAJ MIN PAT REST <<< "$NAME"
          for n in "$MAJ" "${MIN:-0}" "${PAT:-0}"; do
            [[ "$n" =~ ^[0-9]+$ ]] || { echo "::error::Tag $TAG ist keine Version wie v2.1.0"; exit 1; }
          done
          CODE=$(( MAJ * 1000000 + ${MIN:-0} * 10000 + ${PAT:-0} * 100 ))
          # Vorabversionen bekommen kleinere Nummern als die fertige Version: alpha < beta < rc, dann laufende Nummer
          if [ -n "$REST" ]; then
            PRE=$(echo "$REST" | grep -o '[0-9]*$' || true); PRE=${PRE:-0}; PRE=$(( 10#$PRE > 28 ? 28 : 10#$PRE ))
            case "${REST,,}" in
              rc*) STAGE=60 ;;
              beta*|b[0-9]*) STAGE=30 ;;
              *) STAGE=0 ;;
            esac
            CODE=$(( CODE - 100 + STAGE + PRE + 1 ))
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $NAME, versionCode $CODE"

      - name: Signaturschlüssel einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 fehlt – ohne festen Schlüssel funktionieren Updates nicht."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Tests & APK bauen
        run: >
          ./gradlew testDebugUnitTest assembleRelease
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: APK umbenennen
        id: apk
        run: |
          FILE="ByteDroide-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: An das GitHub-Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.apk.outputs.file }}" --clobber

      - name: Im ByteDroide-Store veröffentlichen
        env:
          API_KEY: ${{ secrets.BYTEDROIDE_API_KEY }}
          APP: ${{ vars.BYTEDROIDE_APP }}
          NOTES: ${{ github.event.release.body }}
          CHANNEL: ${{ github.event.release.prerelease && 'beta' || 'stable' }}
        run: |
          if [ -z "$API_KEY" ] || [ -z "$APP" ]; then
            echo "BYTEDROIDE_API_KEY oder BYTEDROIDE_APP nicht gesetzt – Upload in den Store übersprungen."
            exit 0
          fi
          ENC_NOTES=$(printf '%s' "$NOTES" | head -c 3500 | jq -sRr @uri)
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "X-Release-Notes: $ENC_NOTES" \
            --data-binary @"${{ steps.apk.outputs.file }}" \
            "https://apps.nebendahl.eu/api/dev/apps/$APP/releases?channel=$CHANNEL&version=${{ steps.version.outputs.name }}"
          echo
