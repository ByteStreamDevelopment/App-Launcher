# Fester Projektname: sonst nimmt Docker Compose den Ordnernamen ("server") und hält Container aus anderen
# Projekten mit gleichem Ordnernamen für "verwaist" (--remove-orphans würde sie löschen).
name: bytedroide

services:
  bytedroide:
    build: .
    container_name: bytedroide
    restart: unless-stopped
    env_file: .env
    environment:
      # Caddy sitzt davor und liefert die echte Client-IP in X-Forwarded-For
      TRUST_PROXY: "1"
    # Port 8080 nur INTERN im Docker-Netzwerk – auf dem Host wird nichts belegt.
    # Caddy erreicht den Store unter http://bytedroide:8080.
    expose:
      - "8080"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - reverse-proxy

  # Optionaler Virenscan: docker compose --profile clamav up -d  (braucht ca. 1,5 GB RAM)
  # und in der .env CLAMAV_HOST=clamav setzen
  clamav:
    image: clamav/clamav:stable
    container_name: bytedroide-clamav
    profiles: ["clamav"]
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    networks:
      - reverse-proxy

networks:
  reverse-proxy:
    external: true

volumes:
  clamav-db:
