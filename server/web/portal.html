<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entwickler-Portal – ByteDroide</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--brand:#3D5AFE;--brand2:#1A237E;--border:#e5e7eb;
--ok:#059669;--warn:#d97706;--err:#dc2626;--chip:#eef2ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#171a23;--text:#e5e7eb;--muted:#9ca3af;--border:#2a2f3a;--chip:#1e2440}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:20px 16px}
header .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:20px;letter-spacing:.5px}header .sp{flex:1}
header button{background:rgba(255,255,255,.15)}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin:0 0 16px}
h2{margin:0 0 12px;font-size:18px}h3{margin:16px 0 8px;font-size:15px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--card);
color:var(--text);font:inherit}
textarea{min-height:80px;resize:vertical}
button{background:var(--brand);color:#fff;border:0;border-radius:999px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--brand);border:1px solid var(--border)}
button.danger{background:var(--err)}button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:160px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.app{cursor:pointer;transition:transform .1s}.app:hover{transform:translateY(-2px)}
.app .t{display:flex;gap:12px;align-items:center}
.icon{width:48px;height:48px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;
font-weight:700;font-size:20px;color:var(--brand);overflow:hidden;flex:none}.icon img{width:100%;height:100%;object-fit:cover}
.muted{color:var(--muted);font-size:13px}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip);
color:var(--brand);margin:2px 4px 2px 0}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.err{color:var(--err)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left}
code,pre{font-family:Menlo,Consolas,monospace;font-size:13px}pre{background:var(--chip);padding:12px;border-radius:10px;
overflow-x:auto;white-space:pre-wrap;word-break:break-all}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;
border-radius:999px;display:none;max-width:90vw;z-index:9}
progress{width:100%;height:10px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0}.stats div{font-size:13px;color:var(--muted)}
.stats b{display:block;font-size:20px;color:var(--text)}
a{color:var(--brand)}footer{text-align:center;font-size:13px;color:var(--muted);padding:20px}
</style>
</head>
<body>
<header><div class="in"><b>&#129302; ByteDroide</b><span>Entwickler-Portal</span><span class="sp"></span>
<span id="who"></span><button id="logout" style="display:none">Abmelden</button></div></header>
<main id="main"></main>
<footer><a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a> · <a href="/agb">Nutzungsbedingungen</a></footer>
<div id="toast"></div>
<script>
"use strict";
const BASE = location.origin;
let token = null, me = null;
try { token = localStorage.getItem("bd_token"); } catch (e) {}

// --- Hilfen ----------------------------------------------------------------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
const $ = id => document.getElementById(id);
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 4000); }
const money = c => (c / 100).toFixed(2).replace(".", ",") + " €";
const price = c => c ? money(c) : "kostenlos";
const date = ts => ts ? new Date(ts * 1000).toLocaleString("de-DE") : "–";
const size = b => b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.round(b / 1024) + " KB";
const enc = id => id.split("/").map(encodeURIComponent).join("/");

async function api(method, path, body, raw) {
  const opt = { method, headers: {} };
  if (token) opt.headers.Authorization = "Bearer " + token;
  if (body !== undefined) {
    if (raw) { opt.body = body; opt.headers["Content-Type"] = "application/octet-stream"; }
    else { opt.body = JSON.stringify(body); opt.headers["Content-Type"] = "application/json"; }
  }
  const r = await fetch(BASE + path, opt);
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== "/api/login") { logout(true); }
  if (!r.ok) throw new Error(data.error || ("Fehler " + r.status));
  return data;
}
async function run(fn) { try { await fn(); } catch (e) { toast(e.message); } }
function render(...nodes) { const m = $("main"); m.replaceChildren(...nodes); window.scrollTo(0, 0); }

function logout(silent) {
  if (token && !silent) api("POST", "/api/logout", {}).catch(() => {});
  token = null; me = null;
  try { localStorage.removeItem("bd_token"); } catch (e) {}
  start();
}
$("logout").onclick = () => logout();

// --- Anmeldung ------------------------------------------------------------
function loginView() {
  const u = h("input", { autocomplete: "username", placeholder: "Benutzername oder E-Mail" });
  const p = h("input", { type: "password", autocomplete: "current-password", placeholder: "Passwort" });
  const go = () => run(async () => {
    const r = await api("POST", "/api/login", { username: u.value, password: p.value });
    token = r.token; try { localStorage.setItem("bd_token", token); } catch (e) {}
    start();
  });
  p.addEventListener("keydown", e => e.key === "Enter" && go());
  render(h("div", { class: "card", style: "max-width:420px;margin:40px auto" },
    h("h2", {}, "Anmelden"),
    h("p", { class: "muted" }, "Mit deinem ByteDroide-Konto. Noch keins? Registriere dich in der App und beantrage dort " +
      "oder hier den Entwickler-Zugang."),
    h("label", {}, "Benutzername oder E-Mail"), u, h("label", {}, "Passwort"), p,
    h("div", { style: "margin-top:16px" }, h("button", { onclick: go }, "Anmelden"))));
  u.focus();
}

async function start() {
  $("who").textContent = ""; $("logout").style.display = "none";
  if (!token) return loginView();
  try { me = (await api("GET", "/api/me")).user; } catch (e) { return loginView(); }
  $("who").textContent = me.username + " · " + ({ admin: "Admin", developer: "Entwickler", user: "Benutzer" }[me.role]);
  $("logout").style.display = "";
  if (!me.is_developer) return requestView();
  home();
}

function requestView() {
  const note = h("textarea", { placeholder: "Was möchtest du veröffentlichen? (optional)" });
  render(h("div", { class: "card", style: "max-width:560px;margin:30px auto" },
    h("h2", {}, "Entwickler-Zugang"),
    me.dev_requested
      ? h("p", {}, "Deine Anfrage ist eingegangen. Ein Admin prüft sie – du bekommst eine E-Mail, sobald du freigeschaltet bist.")
      : [h("p", {}, "Um Apps zu veröffentlichen, muss ein Admin dein Konto als Entwickler freigeben."),
         h("label", {}, "Nachricht an die Admins"), note,
         h("div", { style: "margin-top:14px" }, h("button", { onclick: () => run(async () => {
           me = (await api("POST", "/api/me/developer", { note: note.value })).user; toast("Anfrage gesendet"); requestView();
         }) }, "Entwickler-Zugang beantragen"))]));
}

// --- Übersicht -------------------------------------------------------------
async function home() {
  const [{ apps }, { keys }] = await Promise.all([api("GET", "/api/dev/apps"), api("GET", "/api/dev/keys")]);
  const nodes = [
    h("div", { class: "card" },
      h("div", { class: "row" }, h("h2", { style: "margin:0" }, "Meine Apps"),
        h("div", { style: "flex:0" }, h("button", { onclick: createView }, "+ Neue App"))),
      apps.length ? h("div", { class: "grid", style: "margin-top:14px" }, apps.map(appCard))
        : h("p", { class: "muted" }, "Noch keine Apps. Lege deine erste an!")),
  ];
  if (me.is_admin) nodes.push(await adminCard());
  nodes.push(keysCard(keys));
  render(...nodes);
}

function icon(app) {
  return h("div", { class: "icon" }, app.avatar_url ? h("img", { src: app.avatar_url, alt: "" }) : app.name[0].toUpperCase());
}
function reviewChip(r) {
  return { approved: h("span", { class: "chip ok" }, "Veröffentlicht"), pending: h("span", { class: "chip warn" }, "In Prüfung"),
           rejected: h("span", { class: "chip err" }, "Abgelehnt") }[r];
}
function appCard(app) {
  return h("div", { class: "card app", onclick: () => appView(app.id) },
    h("div", { class: "t" }, icon(app), h("div", {}, h("b", {}, app.name), h("div", { class: "muted" }, app.id))),
    h("div", { style: "margin-top:10px" }, reviewChip(app.review),
      app.price_cents ? h("span", { class: "chip" }, price(app.price_cents)) : null,
      app.access !== "open" ? h("span", { class: "chip" }, app.access === "code" ? "Mit Code" : "Versteckt") : null,
      app.beta !== "off" ? h("span", { class: "chip" }, "Beta") : null),
    h("div", { class: "muted", style: "margin-top:6px" },
      "Version " + (app.stable || "–") + (app.beta_version ? " · Beta " + app.beta_version : "") +
      " · " + app.downloads + " Downloads"));
}

// --- App anlegen -----------------------------------------------------------
function createView() {
  const f = {
    name: h("input", { placeholder: "z. B. Super Spiel" }),
    slug: h("input", { placeholder: "super-spiel" }),
    description: h("textarea", { placeholder: "Was kann die App?" }),
    category: h("input", { placeholder: "z. B. Spiele" }),
    source: h("select", {}, h("option", { value: "upload" }, "APK hier hochladen"),
      h("option", { value: "repo" }, "Aus einem Repository (GitHub, Forgejo, Gitea, Codeberg)")),
    source_url: h("input", { placeholder: "https://github.com/name/app" }),
    source_token: h("input", { placeholder: "nur für private Repos", type: "password" }),
    price: h("input", { type: "number", min: "0", step: "0.01", value: "0" }),
  };
  f.name.addEventListener("input", () => { if (!f.slug.dataset.touched)
    f.slug.value = f.name.value.toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40); });
  f.slug.addEventListener("input", () => f.slug.dataset.touched = "1");
  const repoBox = h("div", { style: "display:none" }, h("label", {}, "Repository-Adresse"), f.source_url,
    h("label", {}, "Zugangs-Token (optional)"), f.source_token,
    h("p", { class: "muted" }, "Es zählt immer das neueste Release mit einer .apk-Datei. Pre-Releases werden zur Beta."));
  f.source.addEventListener("change", () => repoBox.style.display = f.source.value === "repo" ? "" : "none");
  render(h("div", { class: "card" }, h("h2", {}, "Neue App"),
    h("div", { class: "row" }, h("div", {}, h("label", {}, "Name"), f.name), h("div", {}, h("label", {}, "Kurzname (Adresse)"), f.slug)),
    h("label", {}, "Beschreibung"), f.description,
    h("div", { class: "row" }, h("div", {}, h("label", {}, "Kategorie"), f.category),
      h("div", {}, h("label", {}, "Preis in € (0 = kostenlos)"), f.price)),
    h("label", {}, "Woher kommen die Versionen?"), f.source, repoBox,
    h("p", { class: "muted" }, "Neue Apps werden vor der Veröffentlichung von einem Admin geprüft."),
    h("div", { class: "row", style: "margin-top:10px" }, h("div", { style: "flex:0" }, h("button", { onclick: () => run(async () => {
      const body = { name: f.name.value, slug: f.slug.value, description: f.description.value, category: f.category.value,
        price_cents: Math.round(parseFloat(f.price.value || "0") * 100) };
      if (f.source.value === "repo") { body.source_url = f.source_url.value; body.source_token = f.source_token.value; }
      const app = await api("POST", "/api/dev/apps", body);
      toast("App angelegt"); appView(app.id);
    }) }, "Anlegen")), h("div", { style: "flex:0" }, h("button", { class: "sec", onclick: home }, "Abbrechen")))));
}

// --- App-Details -----------------------------------------------------------
async function appView(id) {
  const app = await api("GET", "/api/dev/apps/" + enc(id));
  const upload = app.source_type === "upload";
  const [rel, codes, testers] = await Promise.all([
    upload ? api("GET", `/api/dev/apps/${enc(id)}/releases`) : { releases: [] },
    api("GET", `/api/dev/apps/${enc(id)}/codes`), api("GET", `/api/dev/apps/${enc(id)}/testers`)]);

  const f = {
    name: h("input", { value: app.name }), description: h("textarea", {}, app.description),
    category: h("input", { value: app.category }), homepage: h("input", { value: app.homepage, placeholder: "https://…" }),
    price: h("input", { type: "number", min: "0", step: "0.01", value: (app.price_cents / 100).toFixed(2) }),
    access: h("select", {}, [["open", "Offen – jeder"], ["code", "Nur mit Freischalt-Code"], ["hidden", "Versteckt"]]
      .map(([v, l]) => h("option", { value: v, selected: app.access === v }, l))),
    beta: h("select", {}, [["off", "Kein Beta-Programm"], ["open", "Offen – jeder kann beitreten"], ["closed", "Geschlossen – nur eingeladene"]]
      .map(([v, l]) => h("option", { value: v, selected: app.beta === v }, l))),
    source_url: h("input", { value: app.source_url }),
    source_token: h("input", { type: "password", placeholder: app.has_source_token ? "•••••• (gespeichert)" : "nur für private Repos" }),
  };
  const save = () => run(async () => {
    const body = { name: f.name.value, description: f.description.value, category: f.category.value, homepage: f.homepage.value,
      price_cents: Math.round(parseFloat(f.price.value || "0") * 100), access: f.access.value, beta: f.beta.value };
    if (!upload && app.source_type !== "forgejo_auto") {
      if (f.source_url.value !== app.source_url) body.source_url = f.source_url.value;
      if (f.source_token.value) body.source_token = f.source_token.value;
    }
    await api("PUT", "/api/dev/apps/" + enc(id), body); toast("Gespeichert"); appView(id);
  });

  const iconInput = h("input", { type: "file", accept: "image/png,image/jpeg,image/webp", style: "display:none", onchange: () => run(async () => {
    await api("POST", `/api/dev/apps/${enc(id)}/icon`, iconInput.files[0], true); toast("Icon gespeichert"); appView(id); }) });

  const nodes = [
    h("div", { class: "card" },
      h("div", { class: "t", style: "display:flex;gap:14px;align-items:center" }, icon(app),
        h("div", { style: "flex:1" }, h("h2", { style: "margin:0" }, app.name), h("div", { class: "muted" }, app.id + (app.package_name ? " · " + app.package_name : ""))),
        h("button", { class: "sec", onclick: home }, "← Zurück")),
      h("div", { style: "margin-top:10px" }, reviewChip(app.review)),
      app.review_note ? h("p", { class: "muted" }, "Hinweis der Prüfung: " + app.review_note) : null,
      app.source_error ? h("p", { style: "color:var(--err)" }, "Quelle: " + app.source_error) : null,
      app.pending_versions.length ? h("p", { style: "color:var(--warn)" }, "Wartet auf Admin-Prüfung: " + app.pending_versions.join(", ")) : null,
      app.blocked_versions.length ? h("p", { style: "color:var(--err)" }, "Gesperrt (abgelehnt/Virenfund): " + app.blocked_versions.join(", ")) : null,
      h("div", { class: "stats" },
        h("div", {}, h("b", {}, app.downloads), "Downloads"), h("div", {}, h("b", {}, app.downloads_30d), "letzte 30 Tage"),
        h("div", {}, h("b", {}, app.sales), "Verkäufe"), h("div", {}, h("b", {}, money(app.revenue_cents)), "Umsatz"),
        h("div", {}, h("b", {}, app.testers), "Beta-Tester"), h("div", {}, h("b", {}, app.unlocked_users), "freigeschaltet"))),
  ];

  if (upload) {
    const file = h("input", { type: "file", accept: ".apk,application/vnd.android.package-archive" });
    const version = h("input", { placeholder: "wird aus der APK gelesen" });
    const channel = h("select", {}, h("option", { value: "stable" }, "Stabil"), h("option", { value: "beta" }, "Beta"));
    const rollout = h("select", {}, [100, 50, 25, 10].map(v => h("option", { value: v }, v === 100 ? "100 % (alle)" : v + " %")));
    const notes = h("textarea", { placeholder: "Was ist neu?" });
    const bar = h("progress", { max: "100", value: "0", style: "display:none" });
    const btn = h("button", { onclick: () => {
      if (!file.files[0]) return toast("Bitte eine APK auswählen");
      const q = new URLSearchParams({ channel: channel.value, version: version.value, notes: notes.value,
        rollout: channel.value === "stable" ? rollout.value : 100 });
      const xhr = new XMLHttpRequest();
      xhr.open("POST", `${BASE}/api/dev/apps/${enc(id)}/releases?${q}`);
      xhr.setRequestHeader("Authorization", "Bearer " + token);
      xhr.setRequestHeader("Content-Type", "application/vnd.android.package-archive");
      xhr.upload.onprogress = e => { bar.style.display = ""; bar.value = e.loaded / e.total * 100; };
      xhr.onload = () => { btn.disabled = false; bar.style.display = "none";
        let r = {}; try { r = JSON.parse(xhr.responseText); } catch (e) {}
        if (xhr.status === 200) { toast(`Version ${r.version} veröffentlicht`); appView(id); } else toast(r.error || "Upload fehlgeschlagen"); };
      xhr.onerror = () => { btn.disabled = false; toast("Upload fehlgeschlagen"); };
      btn.disabled = true; xhr.send(file.files[0]);
    } }, "Hochladen");
    nodes.push(h("div", { class: "card" }, h("h2", {}, "Neue Version hochladen"),
      h("label", {}, "APK-Datei"), file,
      h("div", { class: "row" }, h("div", {}, h("label", {}, "Version (optional)"), version), h("div", {}, h("label", {}, "Kanal"), channel),
        h("div", {}, h("label", {}, "Rollout (nur Stabil)"), rollout)),
      h("label", {}, "Neuigkeiten"), notes, h("div", { style: "margin:12px 0" }, bar), btn,
      h("p", { class: "muted" }, "Paketname, versionName und versionCode werden geprüft. Der versionCode muss bei jedem Upload steigen."),
      rel.releases.length ? h("table", {}, h("tr", {}, h("th", {}, "Version"), h("th", {}, "Kanal"), h("th", {}, "Größe"), h("th", {}, "Datum"), h("th", {})),
        rel.releases.map(r => h("tr", {}, h("td", {}, r.version, h("div", { class: "muted" }, "Code " + (r.version_code ?? "?")),
            r.status === "pending" ? h("span", { class: "chip warn" }, "Wartet auf Prüfung") : null,
            r.status === "rejected" ? h("span", { class: "chip err", title: r.review_note || "" }, "Abgelehnt") : null,
            r.scan === "clean" ? h("span", { class: "chip ok" }, "Virenscan ✓") : null),
          h("td", {}, r.channel === "beta" ? "Beta" : "Stabil",
            r.channel === "stable" && r.status === "approved" ? h("div", {}, h("a", { href: "#", onclick: ev => { ev.preventDefault();
              const v = prompt(`Rollout für ${r.version} in Prozent (1–100):`, r.rollout); if (v) run(async () => {
                await api("PUT", `/api/dev/apps/${enc(id)}/releases/${r.id}`, { rollout: +v }); toast("Rollout: " + v + " %"); appView(id); }); } },
              "Rollout " + r.rollout + " %")) : null), h("td", {}, size(r.size)), h("td", {}, date(r.created_at)),
          h("td", {}, h("button", { class: "sec", onclick: () => confirm(`Version ${r.version} löschen?`) && run(async () => {
            await api("DELETE", `/api/dev/apps/${enc(id)}/releases/${r.id}`); appView(id); }) }, "Löschen"))))) : null,
      h("h3", {}, "Automatisch aus CI hochladen"),
      h("pre", {}, `curl --fail -X POST -H "Authorization: Bearer <API-SCHLÜSSEL>" \\\n  --data-binary @app/build/outputs/apk/release/app-release.apk \\\n  "${BASE}/api/dev/apps/${id}/releases?channel=stable"`)));
  }

  const shotInput = h("input", { type: "file", accept: "image/png,image/jpeg,image/webp", multiple: true, style: "display:none",
    onchange: () => run(async () => { for (const f of shotInput.files) await api("POST", `/api/dev/apps/${enc(id)}/screenshots`, f, true);
      toast("Screenshots hochgeladen"); appView(id); }) });
  nodes.push(h("div", { class: "card" }, h("h2", {}, `Screenshots (${app.screenshots.length}/8)`),
    h("div", { style: "display:flex;gap:10px;overflow-x:auto;padding-bottom:6px" }, app.screenshots.map(sh => h("div", { style: "position:relative;flex:none" },
      h("img", { src: sh.url, style: "height:180px;border-radius:10px;border:1px solid var(--border)" }),
      h("button", { class: "danger", style: "position:absolute;top:6px;right:6px;padding:4px 10px", onclick: () => run(async () => {
        await api("DELETE", `/api/dev/apps/${enc(id)}/screenshots/${sh.id}`); appView(id); }) }, "✕")))),
    app.screenshots.length < 8 ? h("button", { class: "sec", style: "margin-top:10px", onclick: () => shotInput.click() }, "Screenshots hinzufügen") : null,
    shotInput, h("p", { class: "muted" }, "PNG, JPEG oder WebP bis 3 MB. Erscheinen in der App und im Web-Store.")));

  nodes.push(h("div", { class: "card" }, h("h2", {}, "Einstellungen"),
    h("div", { class: "row" }, h("div", {}, h("label", {}, "Name"), f.name), h("div", {}, h("label", {}, "Kategorie"), f.category)),
    h("label", {}, "Beschreibung"), f.description, h("label", {}, "Webseite"), f.homepage,
    !upload && app.source_type !== "forgejo_auto" ? h("div", { class: "row" }, h("div", {}, h("label", {}, "Repository"), f.source_url),
      h("div", {}, h("label", {}, "Token (leer = unverändert)"), f.source_token)) :
      (!upload ? h("p", { class: "muted" }, "Quelle: " + app.source_url) : null),
    h("div", { class: "row" }, h("div", {}, h("label", {}, "Freigabe"), f.access), h("div", {}, h("label", {}, "Beta"), f.beta),
      h("div", {}, h("label", {}, "Preis in €"), f.price)),
    h("div", { class: "row", style: "margin-top:14px" }, h("div", { style: "flex:0" }, h("button", { onclick: save }, "Speichern")),
      h("div", { style: "flex:0" }, h("button", { class: "sec", onclick: () => iconInput.click() }, "Icon hochladen")), iconInput,
      h("div", { style: "flex:0" }, h("button", { class: "danger", onclick: () => confirm(`„${app.name}“ wirklich löschen? Alle Versionen und Codes gehen verloren.`) && run(async () => {
        await api("DELETE", "/api/dev/apps/" + enc(id)); toast("Gelöscht"); home(); }) }, "App löschen")))));

  // Codes
  const note = h("input", { placeholder: "Notiz, z. B. für wen" }), count = h("input", { type: "number", value: "1", min: "1", max: "50" });
  nodes.push(h("div", { class: "card" }, h("h2", {}, "Freischalt-Codes"),
    h("p", { class: "muted" }, "Jeder Code schaltet die App für genau ein Konto dauerhaft frei – auch kostenpflichtige Apps (als Gutschein)."),
    h("div", { class: "row" }, note, h("div", { style: "max-width:100px" }, count),
      h("div", { style: "flex:0" }, h("button", { onclick: () => run(async () => {
        const r = await api("POST", `/api/dev/apps/${enc(id)}/codes`, { count: +count.value, note: note.value });
        toast(r.codes.length + " Code(s) erstellt"); appView(id); }) }, "Erzeugen"))),
    codes.codes.length ? h("table", { style: "margin-top:10px" }, codes.codes.map(c => h("tr", {},
      h("td", {}, h("code", {}, c.code)), h("td", {}, c.note), h("td", { class: "muted" }, c.used_by ? "eingelöst von " + c.used_by : "frei"),
      h("td", {}, h("button", { class: "sec", onclick: () => run(async () => { await api("DELETE", "/api/dev/codes/" + c.code); appView(id); }) }, "Löschen"))))) : null));

  // Tester
  if (app.beta !== "off") {
    const uname = h("input", { placeholder: "Benutzername" });
    nodes.push(h("div", { class: "card" }, h("h2", {}, "Beta-Tester"),
      h("div", { class: "row" }, uname, h("div", { style: "flex:0" }, h("button", { onclick: () => run(async () => {
        await api("POST", `/api/dev/apps/${enc(id)}/testers`, { username: uname.value }); toast("Eingeladen"); appView(id); }) }, "Einladen"))),
      testers.testers.length ? h("table", { style: "margin-top:10px" }, testers.testers.map(t => h("tr", {},
        h("td", {}, t.username), h("td", { class: "muted" }, "seit " + date(t.joined_at)),
        h("td", {}, h("button", { class: "sec", onclick: () => run(async () => { await api("DELETE", `/api/dev/apps/${enc(id)}/testers/${t.id}`); appView(id); }) }, "Entfernen"))))) :
        h("p", { class: "muted" }, "Noch keine Tester.")));
  }
  render(...nodes);
}

// --- API-Schlüssel ---------------------------------------------------------
function keysCard(keys) {
  const label = h("input", { placeholder: "z. B. GitHub Actions" });
  const out = h("div");
  return h("div", { class: "card" }, h("h2", {}, "API-Schlüssel"),
    h("p", { class: "muted" }, "Für automatische Uploads aus CI (z. B. GitHub Actions oder Forgejo Actions). Wie ein Passwort behandeln!"),
    h("div", { class: "row" }, label, h("div", { style: "flex:0" }, h("button", { onclick: () => run(async () => {
      const r = await api("POST", "/api/dev/keys", { label: label.value });
      out.replaceChildren(h("p", {}, "Neuer Schlüssel – wird nur jetzt angezeigt:"), h("pre", {}, r.token));
    }) }, "Erstellen"))), out,
    keys.length ? h("table", { style: "margin-top:10px" }, keys.map(k => h("tr", {}, h("td", {}, k.label),
      h("td", { class: "muted" }, "erstellt " + date(k.created_at)), h("td", { class: "muted" }, "zuletzt " + date(k.last_used)),
      h("td", {}, h("button", { class: "sec", onclick: () => run(async () => { await api("DELETE", "/api/dev/keys/" + k.id); home(); }) }, "Widerrufen"))))) : null);
}

// --- Admin -------------------------------------------------------------------
async function adminCard() {
  const [{ users }, { apps }, ov, { releases }] = await Promise.all([api("GET", "/api/admin/users"), api("GET", "/api/admin/apps"),
    api("GET", "/api/admin/overview"), api("GET", "/api/admin/releases")]);
  const reqs = users.filter(u => u.dev_requested), pending = apps.filter(a => a.review === "pending");
  const warn = [];
  if (!ov.mail_enabled) warn.push("E-Mail-Versand ist nicht eingerichtet (SMTP_* in der .env).");
  if (ov.legal_missing.length) warn.push("Impressum unvollständig: " + ov.legal_missing.join(", "));
  return h("div", { class: "card" }, h("h2", {}, "Admin"),
    h("div", { class: "stats" }, h("div", {}, h("b", {}, ov.users), "Konten"), h("div", {}, h("b", {}, ov.developers), "Entwickler"),
      h("div", {}, h("b", {}, ov.apps), "Apps"), h("div", {}, h("b", {}, ov.downloads_30d), "Downloads (30 T.)"),
      h("div", {}, h("b", {}, money(ov.revenue_cents)), "Umsatz")),
    warn.map(w => h("p", { style: "color:var(--warn)" }, "⚠ " + w)),
    h("h3", {}, `Entwickler-Anfragen (${reqs.length})`),
    reqs.length ? h("table", {}, reqs.map(u => h("tr", {}, h("td", {}, h("b", {}, u.username), h("div", { class: "muted" }, u.email)),
      h("td", { class: "muted" }, u.dev_note || "–"),
      h("td", {}, h("button", { onclick: () => run(async () => { await api("POST", `/api/admin/users/${u.id}/developer`, { approve: true }); toast(u.username + " ist jetzt Entwickler"); home(); }) }, "Annehmen"), " ",
        h("button", { class: "sec", onclick: () => { const n = prompt("Begründung (optional)"); if (n !== null) run(async () => {
          await api("POST", `/api/admin/users/${u.id}/developer`, { approve: false, note: n }); home(); }); } }, "Ablehnen"))))) :
      h("p", { class: "muted" }, "Keine offenen Anfragen."),
    h("h3", {}, `Apps in Prüfung (${pending.length})`),
    pending.length ? h("table", {}, pending.map(a => h("tr", {}, h("td", {}, h("b", {}, a.name), h("div", { class: "muted" }, a.id)),
      h("td", { class: "muted" }, (a.source_type === "upload" ? "Upload" : a.source_url) + " · " + (a.stable || a.beta_version || "noch keine Version")),
      h("td", {}, h("button", { onclick: () => run(async () => { await api("PUT", "/api/admin/apps/" + enc(a.id), { review: "approved" }); toast("Freigegeben"); home(); }) }, "Freigeben"), " ",
        h("button", { class: "sec", onclick: () => { const n = prompt("Begründung"); if (n !== null) run(async () => {
          await api("PUT", "/api/admin/apps/" + enc(a.id), { review: "rejected", review_note: n }); home(); }); } }, "Ablehnen"))))) :
      h("p", { class: "muted" }, "Nichts zu prüfen."),
    h("h3", {}, `Neue Versionen in Prüfung (${releases.length})`),
    releases.length ? h("table", {}, releases.map(r => h("tr", {}, h("td", {}, h("b", {}, r.name + " " + r.version), h("div", { class: "muted" }, r.app + (r.channel === "beta" ? " · Beta" : ""))),
      h("td", { class: "muted" }, (r.notes || "").slice(0, 120)),
      h("td", {}, h("button", { onclick: () => run(async () => { await api("POST", "/api/admin/releases/decide", { app: r.app, channel: r.channel, release_id: r.release_id, approve: true }); toast("Freigegeben"); home(); }) }, "Freigeben"), " ",
        h("button", { class: "sec", onclick: () => { const n = prompt("Begründung"); if (n !== null) run(async () => {
          await api("POST", "/api/admin/releases/decide", { app: r.app, channel: r.channel, release_id: r.release_id, approve: false, note: n }); home(); }); } }, "Ablehnen"))))) :
      h("p", { class: "muted" }, ov.review_releases ? "Nichts zu prüfen." : "Versionsprüfung ist aus (REVIEW_RELEASES=1 schaltet sie ein)."),
    h("p", { class: "muted" }, "Rollen, Käufe und Rundmails verwaltest du in der App im Admin-Bereich."));
}

start();
</script>
